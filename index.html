<!DOCTYPE html>
<html>
	<head>
		<title>List View</title>

		<style>
			div {outline: 0px solid red;}
			#listContent
			{
				width: 1000px;
				height: auto;
				margin: 0 auto 0 auto;
				font-size: 12px;
				font-family: verdana;
			}

			#listHeader
			{
				width: 100%
				font-weight:  bold;
				color: rgb(100, 100, 100);
			}

			#listRows
			{
				width: 100%
			}

			.listViewColumns
			{
				display: grid;
				grid-template-columns: 1fr 10fr 8fr 8fr 8fr 5fr 5fr 5fr 1fr;
				gap: 5px;
			}

			#listPaging
			{
				width: 100%;
			}

			#listPaging div
			{
				float: right;
			}

			.figure
			{
				text-align: right;
			}

			.pageButton
			{
				width: 20px;
				height: 20px;
				font-size: 1.2em;
				background: transparent;
				border: none;
				color: rgb(0, 0, 0);
			}

			.sortbutton, .nobutton
			{
				width: auto;
				height: 1.5em;
				font-size: 1em;
				background: transparent;
				border: none;
				color: rgb(0, 0, 0);
			}

			.pageButton:hover, .sortButton:hover
			{
				color: rgb(255, 0, 0);
			}

			.sortbutton:after
			{
				width: 10px;
				height: 10px;
				margin-left: 10px;
				display: inline-block;
				content: "-";
			}

			.asc:after
			{
				content: "\25B2";
			}

			.desc:after
			{
				content: "\25BC";
			}

			label
			{
				font-weight: bold;
			}

			#txtSearch, #ddlPeriod
			{
				width: 15em;
				margin-right: 1em;
			}
		</style>

		<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

		<script>
			const lv = 
			{
				pageSize: 50,
				pageNo: 1,
				sort: [ {"col": "title", "dir": "asc"}, {"col": "borrowdate", "dir": "desc"} ],
				search: "",
				records: [],
				getRecords: function(year = 2025, month = 3) 
				{
					$.ajax(
						{
							url: `https://oracleapex.com/ords/teochewthunder/borrowing/${year}/${month}`,
							method: "GET",
							success: function(data) 
							{
								lv.records = data.items;
								lv.filterRecords();
								lv.renderPageInfo();

								return;
							},
							error: function (xhr, status, error)
							{
								console.log(xhr);
							}
						}
					);				
				},
				getPages: function()
				{
					return (Math.ceil(this.records.length / this.pageSize));
				},
				setPage: function(index)
				{
					if (index == "next") this.setPageNo(this.pageNo + 1);
					if (index == "prev") this.setPageNo(this.pageNo - 1);
					if (index == "last") this.setPageNo(this.getPages());

					return;
				},
				setPageNo: function(pageNo)
				{
					let finalPageNo = pageNo;
					let pages = this.getPages();
					if (finalPageNo < 1) finalPageNo = 1;
					if (finalPageNo > pages) finalPageNo = pages;

					this.pageNo = finalPageNo;
					this.filterRecords();
					this.renderPageInfo();

					return;
				},
				setPageSize: function(pageSize)
				{
					this.pageSize = pageSize;
					this.pageNo = 1;
					this.filterRecords();
					this.renderPageInfo();

					return;
				},
				setSearch: function(searchTerm)
				{
					this.search = (searchTerm.length > 2 ? searchTerm.toLowerCase() : "");
					this.filterRecords();
					this.renderPageInfo();

					return;
				},
				toggleSort: function(col, id)
				{
					var currentIndex = -1;
					$("#" + id)
					.removeClass("asc")
					.removeClass("desc");

					this.sort.forEach(
						(x, i) => 
						{
							if (x.col == col)
							{
								currentIndex = i;
							}
						}
					);

					if (currentIndex > -1)
					{
						if (this.sort[currentIndex].dir == "asc")
						{
							this.sort[currentIndex].dir = "desc";
							$("#" + id).addClass("desc");
						}
						else
						{
							this.sort.splice(currentIndex, 1);
						}
					} 
					else 
					{
						this.sort.push({ "col": col, "dir": "asc"});
						$("#" + id).addClass("asc");
					}
					
					this.filterRecords();
					return;
				},				
				filterRecords: function() 
				{
					$("#listRows").html("");

					var filtered = structuredClone(this.records);

					if (this.search.length > 2)
					{
						filtered = filtered.filter
						(
							(x) =>
							{
								return (
									x.title.toLowerCase().indexOf(this.search) > -1 ||
									x.category.toLowerCase().indexOf(this.search) > -1 ||
									x.author.toLowerCase().indexOf(this.search) > -1 ||
									x.name.toLowerCase().indexOf(this.search) > -1
								);
							}
						);
					}

					if (this.sort.length > 0)
					{
						this.sort.forEach(
							(x) => 
							{
								if (["title", "author", "name", "category"].indexOf(x.col) > -1) 
								{
									if (x.dir == "asc") filtered.sort((a, b) => a[x.col].localeCompare(b[x.col]));
									if (x.dir == "desc") filtered.sort((a, b) => b[x.col].localeCompare(a[x.col]));									
								}

								if (["borrowdate", "returndate", "returnby"].indexOf(x.col) > -1) 
								{
									if (x.dir == "asc") filtered.sort((a, b) => new Date(a[x.col]) - new Date(b[x.col]));
									if (x.dir == "desc") filtered.sort((a, b) => new Date(b[x.col]) - new Date(a[x.col]));				
								}

								if (["fine"].indexOf(x.col) > -1) 
								{
									if (x.dir == "asc") filtered.sort((a, b) => a[x.col] - b[x.col]);
									if (x.dir == "desc") filtered.sort((a, b) => b[x.col] - a[x.col]);				
								}


							}
						);
					}

					//getsubset
					var startIndex = ((this.pageNo - 1) * this.pageSize);

					filtered = filtered.slice(startIndex, startIndex + parseInt(this.pageSize));

					filtered.forEach(
						(x, i) => 
						{
						    const row = $("<div></div>");
						    row.addClass("listViewColumns");

						    let col;
						    col = $("<div></div>");
						    col.text(i + 1 + startIndex);
						    col.addClass("figure");
						    row.append(col);
						    col = $("<div></div>");
						    col.text(x.title);
						    row.append(col);
						    col = $("<div></div>");
						    col.text(x.author);
						    row.append(col);
						    col = $("<div></div>");
						    col.text(x.category);
						    row.append(col);
						    col = $("<div></div>");
						    col.text(x.name);
						    row.append(col);
						    col = $("<div></div>");
						    col.text(this.prettifyDate(x.borrowdate));
						    col.addClass("figure");
						    row.append(col);
						    col = $("<div></div>");
						    col.text(this.prettifyDate(x.returnby));
						    col.addClass("figure");
						    row.append(col);
						    col = $("<div></div>");
						    col.text(this.prettifyDate(x.returndate));
						    col.addClass("figure");
						    row.append(col);
						    col = $("<div></div>");
						    col.text(x.fine);
						    col.addClass("figure");
						    row.append(col);
						    $("#listRows").append(row);						    
						}
					);

					return;
				},
				prettifyDate: function(dt)
				{
					var arr = dt.split("T");
					return arr[0];
				},
				renderPageInfo: function()
				{
					$("#pnlPageNo").text(this.pageNo);
					$("#pnlPages").text(this.getPages());

					return;
				}
			};

			$(document).ready(
				function() 
				{
					lv.getRecords();
				}
			);
		</script>
	</head>

	<body>
		<div id="listContent">
			<div id="listFilters">
				<label>
					Period: 
					<select id="ddlPeriod" onchange="lv.getRecords(2025, this.value);">
						<option value="3">March 2025</option>
						<option value="4">April 2025</option>
					</select>					
				</label>

				<label>
					Search:
					<input id="txtSearch" placeholder="Search term, e.g, orange" value="" oninput="lv.setSearch(this.value);" />
				</label>

				<hr />
			</div>	
					
			<div id="listHeader" class="listViewColumns">
				<div><button class="nobutton">No</button></div>
				<div><button id="btnSortTitle" class="sortbutton asc" onclick="lv.toggleSort('title', this.id)">Title</button></div>
				<div><button id="btnSortAuthor" class="sortbutton" onclick="lv.toggleSort('author', this.id)">Author</button></div>
				<div><button id="btnSortCategory" class="sortbutton" onclick="lv.toggleSort('category', this.id)">Category</button></div>
				<div><button id="btnSortName" class="sortbutton" onclick="lv.toggleSort('name', this.id)">Name</button></div>
				<div><button id="btnSortBorrowdate" class="sortbutton desc" onclick="lv.toggleSort('borrowdate', this.id)">Borrowed</button></div>
				<div><button id="btnSortReturnBy" class="sortbutton" onclick="lv.toggleSort('returnby', this.id)">Return By</button></div>
				<div><button id="btnSortReturndate" class="sortbutton" onclick="lv.toggleSort('returndate', this.id)">Returned</button></div>
				<div><button id="btnSortFine" class="sortbutton" onclick="lv.toggleSort('fine', this.id)">Fine</button></div>
			</div>

			<div id="listRows">
				
			</div>

			<div id="listPaging">
				<div>
					<button id="btnFirst" class="pageButton" onclick="lv.setPageNo(1)">&laquo;</button>
					<button id="btnPrev" class="pageButton" onclick="lv.setPage('prev')">&lsaquo;</button>	
				
					<span id="pnlPageNo"></span>
					<span>/</span>
					<span id="pnlPages"></span>

					<button id="btnNext" class="pageButton" onclick="lv.setPage('next')">&rsaquo;</button>
					<button id="btnLast" class="pageButton"onclick="lv.setPage('last')">&raquo;</button>
				</div>

				<div>
					Records per Page
					<select onchange="lv.setPageSize(this.value)">
						<option value="20" >20</option>
						<option value="50" selected>50</option>
						<option value="100">100</option>
						<option value="500">500</option>
					</select>				
				</div>
			</div>
		</div>
	</body>
</html>
