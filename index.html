<!DOCTYPE html>
<html>
	<head>
		<title>List View</title>

		<style>
			#listContent
			{
				width: 1000px;
				height: auto;
				margin: 0 auto 0 auto;
				font-size: 12px;
				font-family: verdana;
			}

			#listHeader
			{
				width: 100%
				font-weight:  bold;
				color: rgb(100, 100, 100);
			}

			#listRows
			{
				width: 100%
			}

			.listViewColumns
			{
				display: grid;
				grid-template-columns: 1fr 10fr 8fr 8fr 8fr 5fr 5fr 5fr 1fr;
				gap: 5px;
			}

			.figure
			{
				text-align: right;
			}
		</style>

		<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

		<script>
			const lv = 
			{
				pageSize: 50,
				pageNo: 1,
				sort: [ {"col": "title", "dir": "asc"}, {"col": "borrowdate", "dir": "desc"} ],
				search: "",
				records: [],
				getRecords: function(year = 2025, month = 3) 
				{
					$.ajax(
						{
							url: `https://oracleapex.com/ords/teochewthunder/borrowing/${year}/${month}`,
							method: "GET",
							success: function(data) 
							{
								lv.records = data.items;
								lv.filterRecords();
							},
							error: function (xhr, status, error)
							{
								console.log(xhr);
							}
						}
					)					
				},
				filterRecords: function() 
				{
					var filtered = structuredClone(this.records);

					if (this.search.length > 0)
					{
						filtered = filtered.filter
						(
							(x) =>
							{
								return 
								(
									x.title.indexOf(this.search) > -1 ||
									x.category.indexOf(this.search) > -1 ||
									x.author.indexOf(this.search) > -1 ||
									x.name.indexOf(this.search) > -1
								);
							}
						)
					}

					if (this.sort.length > 0)
					{
						this.sort.forEach(
							(x) => 
							{
								if (["title", "author", "name", "category"].indexOf(x.col) > -1) 
								{
									if (x.dir == "asc") filtered.sort((a, b) => a[x.col].localeCompare(b[x.col]));
									if (x.dir == "desc") filtered.sort((a, b) => b[x.col].localeCompare(a[x.col]));									
								}

								if (["borrowdate", "returndate", "returnby"].indexOf(x.col) > -1) 
								{
									if (x.dir == "asc") filtered.sort((a, b) => new Date(a[x.col]) - new Date(b[x.col]));
									if (x.dir == "desc") filtered.sort((a, b) => new Date(b[x.col]) - new Date(a[x.col]));				
								}

								if (["fine"].indexOf(x.col) > -1) 
								{
									if (x.dir == "asc") filtered.sort((a, b) => a[x.col] - b[x.col]);
									if (x.dir == "desc") filtered.sort((a, b) => b[x.col] - a[x.col]);				
								}
							}
						);
					}

					//getsubset
					var startIndex = (this.pageNo - 1) * this.pageSize;

					filtered = filtered.slice(startIndex, this.pageSize);

					filtered.forEach(
						(x, i) => 
						{
						    const row = $("<div></div>");
						    row.addClass("listViewColumns");

						    let col;
						    col = $("<div></div>");
						    col.text(i + 1);
						    col.addClass("figure");
						    row.append(col);
						    col = $("<div></div>");
						    col.text(x.title);
						    row.append(col);
						    col = $("<div></div>");
						    col.text(x.author);
						    row.append(col);
						    col = $("<div></div>");
						    col.text(x.category);
						    row.append(col);
						    col = $("<div></div>");
						    col.text(x.name);
						    row.append(col);
						    col = $("<div></div>");
						    col.text(this.prettifyDate(x.borrowdate));
						    col.addClass("figure");
						    row.append(col);
						    col = $("<div></div>");
						    col.text(this.prettifyDate(x.returnby));
						    col.addClass("figure");
						    row.append(col);
						    col = $("<div></div>");
						    col.text(this.prettifyDate(x.returndate));
						    col.addClass("figure");
						    row.append(col);
						    col = $("<div></div>");
						    col.text(x.fine);
						    col.addClass("figure");
						    row.append(col);
						    $("#listRows").append(row);						    
						}
					)
				},
				prettifyDate: function(dt)
				{
					var arr = dt.split("T");
					return arr[0];
				}
			};

			$(document).ready(
				function() 
				{
					lv.getRecords();
				}
			);
		</script>
	</head>

	<body>
		<div id="listFilters">
			
		</div>

		<div id="listContent">
			<div id="listHeader" class="listViewColumns">
				<div>No</div>
				<div>Title</div>
				<div>Author</div>
				<div>Category</div>
				<div>Borrower</div>
				<div>Borrowed</div>
				<div>Return By</div>
				<div>Returned</div>
				<div>Fine</div>
			</div>

			<div id="listRows">
				
			</div>
		</div>

		<div id="listPaging">
			Records per Page
			<select>
				<option value="20">20</option>
				<option value="20">50</option>
				<option value="20">100</option>
				<option value="20">500</option>
			</select>
			<button></button>
			<button></button>
			<span></span>
			<button></button>
			<button></button>
		</div>
	</body>
</html>
